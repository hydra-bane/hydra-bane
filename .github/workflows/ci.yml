name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # PLAN.md §6.11: quarantine, undo and crash injection on a throwaway VHDX mounted as X: (runners are admin).
      # The runner's C: is not touched by these tests. Locally the tests fall back to the temp folder.
      - name: 'Mount VHDX test volume (X:)'
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'hb-test.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'hb-mount.txt'
          @(
            "create vdisk file=`"$vhd`" maximum=1024 type=expandable",
            "select vdisk file=`"$vhd`"",
            'attach vdisk',
            'create partition primary',
            'format fs=ntfs quick label=HBTEST',
            'assign letter=X'
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Volume -DriveLetter X
      - name: 'Quarantine and crash tests on X:'
        shell: pwsh
        env:
          HYDRA_BANE_TEST_VOLUME: 'X:\'
        run: |
          npx vitest run test/crash.test.ts test/quarantine.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'X:\hb-tests')) { Write-Error 'tests did not run on X:'; exit 1 }
      - name: Detach VHDX
        if: always()
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'hb-test.vhdx'
          if (-not (Test-Path $vhd)) { exit 0 }
          $script = Join-Path $env:RUNNER_TEMP 'hb-detach.txt'
          @("select vdisk file=`"$vhd`"", 'detach vdisk') | Set-Content -Encoding ascii $script
          diskpart /s $script
      - name: CLI smoke (read-only)
        run: |
          node src/cli.ts version
          node src/cli.ts scan --only temp --json
      - name: Guard hook smoke
        shell: bash
        run: |
          out=$(echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /c/"}}' | node src/hook/run.ts)
          echo "$out" | grep -q '"permissionDecision":"deny"'
      - name: Package smoke (npm pack -> install -> npx)
        shell: bash
        run: |
          npm run build
          tgz=$(npm pack | tail -1)
          mkdir -p "$RUNNER_TEMP/sim" && cd "$RUNNER_TEMP/sim"
          npm init -y > /dev/null
          npm i --no-audit --no-fund "$GITHUB_WORKSPACE/$tgz"
          npx hydra-bane version
          npx hydra-bane scan --only temp --json
