name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: CLI smoke (read-only)
        run: |
          node src/cli.ts version
          node src/cli.ts scan --only temp --json
      - name: Guard hook smoke
        shell: bash
        run: |
          out=$(echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /c/"}}' | node src/hook/run.ts)
          echo "$out" | grep -q '"permissionDecision":"deny"'
